# Local-only Postgres for Strapi development.
# Values match the defaults in .env.example. Not used in production (Supabase Postgres is).
services:
  postgres:
    image: postgres:16
    container_name: hhha-strapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "5432:5432"
    volumes:
      - strapi-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  strapi-postgres-data:
