name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Mobile app (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  studio:
    name: Sanity Studio (typecheck, schema, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx sanity schemas validate
      - run: npm run build

  supabase:
    name: Supabase (RLS tests, function tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Pure-logic tests for the Edge Functions (Node 22 strips TypeScript types).
      - run: node --test --experimental-strip-types supabase/functions/tests/*_test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # A throwaway local database in Docker: applies every migration, then runs pgTAP.
      # Uses a generated signing key; the real dev key is gitignored.
      - run: |
          echo '[]' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --append
          supabase db start
          supabase test db
